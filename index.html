<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales & Inventory Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Sales & Inventory Manager</h1>
      <p class="subtitle">Real-time revenue tracking & investment deductions</p>
    </header>

    <!-- Metrics Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Gross Revenue</h3>
        <p class="stat-value" id="grossRevenue">0 PHP</p>
      </div>
      <div class="stat-card">
        <h3>Investment Deduction</h3>
        <p class="stat-value text-red" id="investmentDeduction">-500 PHP</p>
      </div>
      <div class="stat-card highlight">
        <h3>Net Profit</h3>
        <p class="stat-value text-green" id="netProfit">0 PHP</p>
      </div>
    </div>

    <!-- Main Content: Form & Table -->
    <div class="content-grid">
      <!-- Record Sale Form -->
      <section class="card form-section">
        <h2>Record New Sale</h2>
        <form id="saleForm">
          <div class="form-group">
            <label for="planSelect">Select Plan</label>
            <select id="planSelect" required>
              <option value="">-- Choose a Plan --</option>
              <option value="GPT K12 Plan">GPT K12 Plan</option>
              <option value="Gemini AI Pro 18m">Gemini AI Pro 18 months Plan</option>
            </select>
          </div>

          <div class="form-group">
            <label for="priceSelect">Variant Price</label>
            <select id="priceSelect" required disabled>
              <option value="">-- Select Plan First --</option>
            </select>
          </div>

          <div class="form-group">
            <label for="quantity">Quantity Sold</label>
            <input type="number" id="quantity" min="1" value="1" required />
          </div>

          <div class="form-group inline-checkbox">
            <input type="checkbox" id="deductInvestment" checked />
            <label for="deductInvestment">Apply 500 PHP Investment Deduction</label>
          </div>

          <div class="preview-box">
            <span>Calculated Total:</span>
            <strong id="previewTotal">0 PHP</strong>
          </div>

          <button type="submit" class="btn-primary">Add Sale Record</button>
        </form>
      </section>

      <!-- Sales Table -->
      <section class="card table-section">
        <h2>Recent Transactions</h2>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Plan</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="salesTableBody">
              <tr>
                <td colspan="5" class="empty-state">No sales recorded yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
